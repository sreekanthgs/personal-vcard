<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Save Contact</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --subtext: #94a3b8;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
    }

    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
    }

    .card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 32px 24px;
      width: 90%;
      max-width: 380px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
    }

    .avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: var(--accent);
      color: white;
      font-size: 32px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px auto;
    }

    h1 {
      margin: 0 0 6px 0;
      font-size: 22px;
    }

    p {
      margin: 0 0 24px 0;
      color: var(--subtext);
      font-size: 14px;
    }

    .btn {
      display: inline-block;
      width: 100%;
      padding: 14px 0;
      font-size: 16px;
      font-weight: 600;
      color: white;
      background-color: var(--accent);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      text-decoration: none;
      transition: background-color 0.2s ease;
      box-sizing: border-box;
    }

    .btn:hover {
      background-color: var(--accent-hover);
    }

    .notice {
      margin-top: 18px;
      font-size: 12px;
      color: var(--subtext);
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="avatar">JD</div>
    <h1>John Doe</h1>
    <p>Senior Engineer • Acme Corp</p>
    
    <button class="btn" id="saveContactBtn">Save Contact</button>

    <div class="notice">
      Tap above to download or open directly in your phone's Contacts app.
    </div>
  </div>

  <script>
    document.getElementById('saveContactBtn').addEventListener('click', function () {
      // Build vCard 3.0 string with mandatory CRLF (\r\n) line terminators
      const vcard = [
        'BEGIN:VCARD',
        'VERSION:3.0',
        'N:Doe;John;;;',
        'FN:John Doe',
        'ORG:Acme Corporation',
        'TITLE:Senior Engineer',
        'TEL;TYPE=CELL,VOICE:+1-555-019-2834',
        'EMAIL;TYPE=WORK,INTERNET:johndoe@example.com',
        'URL:https://example.com',
        'NOTE:Added via GitHub Pages vCard demo',
        'END:VCARD'
      ].join('\r\n');

      // Create a Blob using the official vCard MIME type
      const blob = new Blob([vcard], { type: 'text/vcard;charset=utf-8;' });
      const url = window.URL.createObjectURL(blob);

      // Create invisible link and trigger native file handoff
      const a = document.createElement('a');
      a.style.display = 'none';
      a.href = url;
      a.setAttribute('download', 'JohnDoe.vcf');
      document.body.appendChild(a);
      a.click();

      // Clean up DOM and memory
      document.body.removeChild(a);
      setTimeout(() => window.URL.revokeObjectURL(url), 1000);
    });
  </script>

</body>
</html>
